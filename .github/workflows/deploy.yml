
name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /johnceasar

      # Ensure GitHub Pages does not process _next using Jekyll
      - name: Create nojekyll file
        run: touch out/.nojekyll

      # Stop deployment if important files are missing
      - name: Verify production files
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -d out/_next/static
          test -n "$(find out/_next/static -type f -name '*.css' -print -quit)"
          test -n "$(find out/_next/static -type f -name '*.js' -print -quit)"
          test -f out/photos/hundred-islands-1280.webp
          echo "All required production files exist."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
